<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="820" viewBox="0 0 1260 820" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1260" height="820" fill="#ffffff"/>
  <text x="30" y="36" font-size="20" font-weight="700" fill="#1f2937">Modelo Relacional (MER) - Sistema de Avaliacoes (BD I)</text>
  <text x="30" y="56" font-size="12" fill="#5b6573">Natureza: Avaliacao de aprendizagem | 8 tabelas normalizadas na 3FN</text>

  <defs>
    <style>
      .tbl-box { fill: #ffffff; stroke: #334155; stroke-width: 1.5; rx: 4; }
      .tbl-hdr { fill: #1f4d3a; }
      .tbl-title { fill: #ffffff; font-size: 13px; font-weight: 700; }
      .col-txt { fill: #1f2937; font-size: 11.5px; }
      .pk { fill: #b45309; font-weight: 700; font-size: 10.5px; }
      .fk { fill: #1d4ed8; font-weight: 700; font-size: 10.5px; }
      .rel-line { stroke: #475467; stroke-width: 1.5; fill: none; }
      .card-txt { fill: #111827; font-size: 11px; font-weight: 700; }
      .rel-lbl { fill: #475467; font-size: 10.5px; font-style: italic; }
    </style>
  </defs>

  <!-- Relationship lines (drawn under tables) -->
  <!-- turma -> usuario -->
  <path class="rel-line" d="M 250 135 L 330 135"/>
  <text class="card-txt" x="260" y="128">1</text>
  <text class="card-txt" x="310" y="128">N</text>
  <text class="rel-lbl" x="264" y="150">pertence</text>

  <!-- usuario -> questao -->
  <path class="rel-line" d="M 560 120 L 660 120"/>
  <text class="card-txt" x="570" y="113">1</text>
  <text class="card-txt" x="642" y="113">N</text>
  <text class="rel-lbl" x="588" y="135">cria</text>

  <!-- questao -> alternativa -->
  <path class="rel-line" d="M 900 135 L 990 135"/>
  <text class="card-txt" x="910" y="128">1</text>
  <text class="card-txt" x="970" y="128">N</text>
  <text class="rel-lbl" x="920" y="150">possui</text>

  <!-- usuario -> avaliacao -->
  <path class="rel-line" d="M 445 265 L 445 340 L 145 340 L 145 380"/>
  <text class="card-txt" x="452" y="285">1</text>
  <text class="card-txt" x="152" y="372">N</text>
  <text class="rel-lbl" x="270" y="333">elabora</text>

  <!-- avaliacao -> avaliacao_questao -->
  <path class="rel-line" d="M 270 465 L 355 465"/>
  <text class="card-txt" x="278" y="458">1</text>
  <text class="card-txt" x="336" y="458">N</text>
  <text class="rel-lbl" x="284" y="480">compoe</text>

  <!-- questao -> avaliacao_questao -->
  <path class="rel-line" d="M 760 250 L 760 355 L 480 355 L 480 400"/>
  <text class="card-txt" x="767" y="270">1</text>
  <text class="card-txt" x="488" y="392">N</text>
  <text class="rel-lbl" x="595" y="348">reutilizada em</text>

  <!-- avaliacao -> avaliacao_usuario -->
  <path class="rel-line" d="M 145 585 L 145 640"/>
  <text class="card-txt" x="152" y="603">1</text>
  <text class="card-txt" x="152" y="632">N</text>
  <text class="rel-lbl" x="154" y="618">atribuida a</text>

  <!-- usuario -> avaliacao_usuario -->
  <path class="rel-line" d="M 410 265 L 410 305 L 25 305 L 25 710 L 40 710"/>
  <text class="card-txt" x="416" y="285">1</text>
  <text class="card-txt" x="28" y="700">N</text>

  <!-- avaliacao_usuario -> resposta -->
  <path class="rel-line" d="M 275 710 L 580 710"/>
  <text class="card-txt" x="284" y="703">1</text>
  <text class="card-txt" x="560" y="703">N</text>
  <text class="rel-lbl" x="395" y="703">registra</text>

  <!-- avaliacao_questao -> resposta -->
  <path class="rel-line" d="M 480 540 L 480 650 L 580 650"/>
  <text class="card-txt" x="488" y="560">1</text>
  <text class="card-txt" x="560" y="643">N</text>
  <text class="rel-lbl" x="492" y="635">responde</text>

  <!-- alternativa -> resposta -->
  <path class="rel-line" d="M 1110 235 L 1110 680 L 890 680"/>
  <text class="card-txt" x="1117" y="255">1</text>
  <text class="card-txt" x="900" y="673">N</text>
  <text class="rel-lbl" x="970" y="673">marcada em (opcional)</text>

  <!-- usuario -> resposta (corrigida_por) -->
  <path class="rel-line" d="M 520 265 L 520 330 L 940 330 L 940 735 L 890 735" stroke-dasharray="5,4"/>
  <text class="rel-lbl" x="946" y="540">corrigida_por (FK)</text>

  <!-- TABLE: turma -->
  <g transform="translate(40,80)">
    <rect class="tbl-box" width="210" height="125"/>
    <rect class="tbl-hdr" width="210" height="28" rx="3"/>
    <text class="tbl-title" x="12" y="19">turma</text>
    <text class="pk" x="10" y="48">PK</text><text class="col-txt" x="34" y="48">id : SERIAL</text>
    <text class="col-txt" x="34" y="68">codigo : VARCHAR(20) UQ</text>
    <text class="col-txt" x="34" y="88">nome : VARCHAR(100)</text>
    <text class="col-txt" x="34" y="108">ano_semestre : VARCHAR(10)</text>
  </g>

  <!-- TABLE: usuario -->
  <g transform="translate(330,80)">
    <rect class="tbl-box" width="230" height="185"/>
    <rect class="tbl-hdr" width="230" height="28" rx="3"/>
    <text class="tbl-title" x="12" y="19">usuario</text>
    <text class="pk" x="10" y="48">PK</text><text class="col-txt" x="34" y="48">id : SERIAL</text>
    <text class="col-txt" x="34" y="68">nome : VARCHAR(120)</text>
    <text class="col-txt" x="34" y="88">email : VARCHAR(150) UQ</text>
    <text class="col-txt" x="34" y="108">senha : VARCHAR(100)</text>
    <text class="col-txt" x="34" y="128">perfil : VARCHAR(20)</text>
    <text class="fk" x="10" y="148">FK</text><text class="col-txt" x="34" y="148">turma_id : INTEGER (NULL)</text>
    <text class="col-txt" x="34" y="168">ativo : BOOLEAN</text>
  </g>

  <!-- TABLE: questao -->
  <g transform="translate(660,80)">
    <rect class="tbl-box" width="240" height="170"/>
    <rect class="tbl-hdr" width="240" height="28" rx="3"/>
    <text class="tbl-title" x="12" y="19">questao</text>
    <text class="pk" x="10" y="48">PK</text><text class="col-txt" x="34" y="48">id : SERIAL</text>
    <text class="col-txt" x="34" y="68">enunciado : TEXT</text>
    <text class="col-txt" x="34" y="88">tipo : VARCHAR(20)</text>
    <text class="col-txt" x="34" y="108">disciplina : VARCHAR(80)</text>
    <text class="col-txt" x="34" y="128">dificuldade : VARCHAR(15)</text>
    <text class="fk" x="10" y="148">FK</text><text class="col-txt" x="34" y="148">criado_por : INTEGER</text>
  </g>

  <!-- TABLE: alternativa -->
  <g transform="translate(990,80)">
    <rect class="tbl-box" width="235" height="155"/>
    <rect class="tbl-hdr" width="235" height="28" rx="3"/>
    <text class="tbl-title" x="12" y="19">alternativa</text>
    <text class="pk" x="10" y="48">PK</text><text class="col-txt" x="34" y="48">id : SERIAL</text>
    <text class="fk" x="10" y="68">FK</text><text class="col-txt" x="34" y="68">questao_id : INTEGER</text>
    <text class="col-txt" x="34" y="88">letra : CHAR(1) (UQ q_id)</text>
    <text class="col-txt" x="34" y="108">texto : TEXT</text>
    <text class="col-txt" x="34" y="128">correta : BOOLEAN</text>
  </g>

  <!-- TABLE: avaliacao -->
  <g transform="translate(40,380)">
    <rect class="tbl-box" width="230" height="205"/>
    <rect class="tbl-hdr" width="230" height="28" rx="3"/>
    <text class="tbl-title" x="12" y="19">avaliacao</text>
    <text class="pk" x="10" y="48">PK</text><text class="col-txt" x="34" y="48">id : SERIAL</text>
    <text class="col-txt" x="34" y="68">titulo : VARCHAR(150)</text>
    <text class="col-txt" x="34" y="88">descricao : TEXT</text>
    <text class="col-txt" x="34" y="108">tipo : VARCHAR(20)</text>
    <text class="col-txt" x="34" y="128">data_aplicacao : DATE</text>
    <text class="col-txt" x="34" y="148">hora_inicio : TIME</text>
    <text class="col-txt" x="34" y="168">hora_fim : TIME</text>
    <text class="fk" x="10" y="188">FK</text><text class="col-txt" x="34" y="188">criado_por : INTEGER</text>
  </g>

  <!-- TABLE: avaliacao_questao -->
  <g transform="translate(355,400)">
    <rect class="tbl-box" width="250" height="140"/>
    <rect class="tbl-hdr" width="250" height="28" rx="3"/>
    <text class="tbl-title" x="12" y="19">avaliacao_questao</text>
    <text class="pk" x="10" y="48">PK/FK</text><text class="col-txt" x="52" y="48">avaliacao_id : INTEGER</text>
    <text class="pk" x="10" y="68">PK/FK</text><text class="col-txt" x="52" y="68">questao_id : INTEGER</text>
    <text class="col-txt" x="52" y="88">ordem : INTEGER (UQ av_id)</text>
    <text class="col-txt" x="52" y="108">valor : NUMERIC(5,2)</text>
  </g>

  <!-- TABLE: avaliacao_usuario -->
  <g transform="translate(40,640)">
    <rect class="tbl-box" width="235" height="135"/>
    <rect class="tbl-hdr" width="235" height="28" rx="3"/>
    <text class="tbl-title" x="12" y="19">avaliacao_usuario</text>
    <text class="pk" x="10" y="48">PK/FK</text><text class="col-txt" x="52" y="48">avaliacao_id : INTEGER</text>
    <text class="pk" x="10" y="68">PK/FK</text><text class="col-txt" x="52" y="68">usuario_id : INTEGER</text>
    <text class="col-txt" x="52" y="88">status : VARCHAR(20)</text>
    <text class="col-txt" x="52" y="108">enviada_em : TIMESTAMP</text>
  </g>

  <!-- TABLE: resposta -->
  <g transform="translate(580,580)">
    <rect class="tbl-box" width="310" height="215"/>
    <rect class="tbl-hdr" width="310" height="28" rx="3"/>
    <text class="tbl-title" x="12" y="19">resposta</text>
    <text class="pk" x="10" y="48">PK</text><text class="col-txt" x="40" y="48">id : SERIAL</text>
    <text class="fk" x="10" y="68">FK</text><text class="col-txt" x="40" y="68">avaliacao_id : INTEGER</text>
    <text class="fk" x="10" y="88">FK</text><text class="col-txt" x="40" y="88">usuario_id : INTEGER</text>
    <text class="fk" x="10" y="108">FK</text><text class="col-txt" x="40" y="108">questao_id : INTEGER</text>
    <text class="fk" x="10" y="128">FK</text><text class="col-txt" x="40" y="128">alternativa_id : INTEGER (NULL)</text>
    <text class="col-txt" x="40" y="148">texto_resposta : TEXT (NULL)</text>
    <text class="col-txt" x="40" y="168">nota_obtida : NUMERIC(5,2) (NULL)</text>
    <text class="fk" x="10" y="188">FK</text><text class="col-txt" x="40" y="188">corrigida_por : INTEGER (NULL)</text>
    <text class="col-txt" x="40" y="205">corrigida_em / respondida_em</text>
  </g>
</svg>
